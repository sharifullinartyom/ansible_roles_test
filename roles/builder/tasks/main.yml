---
- name: 1. Ensure tools package is present
  apt:
    name:
      - default-jdk
      - maven
      - git
    state: present
    update_cache: yes
  become: true

- name: 2. Create build directory
  file:
    path: "{{ build_dir }}"
    state: directory
    mode: "0755"

- name: 3. Clone git repo
  git:
    repo: "{{ repo_url }}"
    dest: "{{ build_dir }}"
    update: yes

- name: 4. Build project with Maven
  command: mvn clean package -DskipTests
  args:
    chdir: "{{ build_dir }}"
  register: maven_build
  failed_when: false

- name: 5. Fail if Maven build failed
  fail:
    msg: |
      Maven build failed.
      Return code: {{ maven_build.rc }}
      Stderr: {{ maven_build.stderr | default('') }}
  when: maven_build.rc != 0

- name: 6. Find generated WAR file
  find:
    paths: "{{ build_dir }}/target"
    patterns: "*.war"
    recurse: yes
  register: war_file

- name: 7. Fail if no WAR found
  fail:
    msg: |
      WAR file not found after build.
      Searched in: {{ build_dir }}/target
  when: war_file.files | length == 0

- name: 8. Set fact for WAR path
  set_fact:
    war_path: "{{ war_file.files[0].path }}"
    war_filename: "{{ war_file.files[0].path | basename }}"
    build_result: "success"

- name: 9. Pull WAR to controller
  fetch:
    src: "{{ war_path }}"
    dest: "/tmp/{{ app_name }}/"
    flat: yes